name: Release

# Push a tag like v1.0.1  ->  builds the APK and publishes it as the latest GitHub release.
# The in-app updater compares this tag with the installed version.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (one universal APK)
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:assembleFossRelease -x lint -x lintFossRelease --warning-mode summary

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/foss/release/*.apk dist/Melyvio.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/Melyvio.apk \
            --title "Melyvio ${GITHUB_REF_NAME}" \
            --generate-notes
